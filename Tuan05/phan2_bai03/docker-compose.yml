services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: mydb
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: root_password

  phpmyadmin:
    image: phpmyadmin:latest
    restart: always
    ports:
      - "8081:80" 
    environment:
      PMA_HOST: db 
      PMA_USER: root
      PMA_PASSWORD: root_password
    depends_on:
      - db 