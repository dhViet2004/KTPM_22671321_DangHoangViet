services:
  vote:
    image: dockersamples/examplevotingapp_vote:before
    container_name: p3-b5-vote
    ports:
      - "5000:80"
    depends_on:
      - redis

  result:
    image: dockersamples/examplevotingapp_result:before
    container_name: p3-b5-result
    ports:
      - "5001:80"
    depends_on:
      - db

  worker:
    image: dockersamples/examplevotingapp_worker
    container_name: p3-b5-worker
    depends_on:
      - redis
      - db

  redis:
    image: redis:alpine
    container_name: p3-b5-redis

  db:
    image: postgres:15-alpine
    container_name: p3-b5-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: votes
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
