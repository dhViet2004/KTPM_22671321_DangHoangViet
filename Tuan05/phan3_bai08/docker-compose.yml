services:
  redis:
    image: redis:alpine
    container_name: p3-b8-redis
    restart: unless-stopped

  web:
    build: ./app
    container_name: p3-b8-django
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    depends_on:
      - redis
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0

  celery:
    build: ./app
    container_name: p3-b8-celery
    command: celery -A app worker -l info
    depends_on:
      - redis
      - web
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
